<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thêm tên hàng loạt</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1018;
      --panel: rgba(24, 31, 45, .88);
      --line: #303b50;
      --text: #f4f7fb;
      --muted: #94a1b7;
      --accent: #72e0b5;
      --accent2: #7ab6ff;
      --danger: #ff8f8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0, rgba(62, 128, 115, .25), transparent 36%),
        radial-gradient(circle at 100% 100%, rgba(64, 92, 150, .26), transparent 38%),
        var(--bg);
    }
    main { width: min(920px, 100%); margin: auto; }
    h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 46px); letter-spacing: -.04em; }
    .lead { margin: 0 0 25px; color: var(--muted); }
    .card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 22px 65px rgba(0, 0, 0, .24);
      backdrop-filter: blur(16px);
    }
    #dropZone {
      display: grid;
      place-items: center;
      min-height: 155px;
      padding: 24px;
      border: 2px dashed #41516d;
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      transition: .18s ease;
    }
    #dropZone:hover, #dropZone.dragging { border-color: var(--accent); background: rgba(114, 224, 181, .07); transform: translateY(-1px); }
    #dropZone strong { display: block; font-size: 18px; }
    #dropZone span { margin-top: 6px; color: var(--muted); }
    #fileInput { display: none; }
    #fileInfo { color: var(--accent); overflow-wrap: anywhere; }
    .grid { display: grid; grid-template-columns: 1fr 170px; gap: 16px; margin-top: 18px; }
    label { display: block; margin-bottom: 7px; color: #cdd6e4; font-weight: 650; }
    textarea, input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #101722;
      color: var(--text);
      outline: none;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(122, 182, 255, .12); }
    textarea { min-height: 165px; padding: 12px; resize: vertical; }
    input, select { height: 43px; padding: 0 11px; }
    .stack { display: grid; align-content: start; gap: 15px; }
    .hint { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .summary { display: flex; justify-content: space-between; gap: 12px; margin: 18px 0 9px; }
    #counter { color: var(--accent); font-weight: 750; }
    #preview {
      max-height: 230px;
      overflow: auto;
      margin: 0;
      padding: 10px 10px 10px 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0d131d;
      color: #dce4ef;
    }
    #preview li { padding: 3px 5px; overflow-wrap: anywhere; }
    #preview .empty { color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    button {
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #07130f;
      background: var(--accent);
      font: inherit;
      font-weight: 780;
      cursor: pointer;
    }
    button.secondary { color: var(--text); background: #202a3a; border-color: var(--line); }
    button:disabled { opacity: .38; cursor: not-allowed; }
    #status { min-height: 24px; margin: 13px 0 0; color: var(--muted); }
    #status.ok { color: var(--accent); }
    #status.error { color: var(--danger); }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } body { padding: 18px 12px; } .card { padding: 14px; } }
  </style>
</head>
<body>
  <main>
    <h1>Thêm tên hàng loạt</h1>
    <p class="lead">Kéo một file vào, nhập các tên muốn nối phía sau rồi xuất toàn bộ chỉ với một lần bấm.</p>
    <section class="card">
      <div id="dropZone" role="button" tabindex="0" aria-label="Chọn file nguồn">
        <div>
          <strong>Kéo file HTML vào đây</strong>
          <span id="fileInfo">hoặc bấm để chọn file (tool vẫn dùng được với mọi loại file)</span>
        </div>
      </div>
      <input id="fileInput" type="file">

      <div class="grid">
        <div>
          <label for="suffixes">Danh sách tên thêm phía sau</label>
          <textarea id="suffixes" spellcheck="false" placeholder="facebook&#10;tiktok&#10;google_ads"></textarea>
          <p class="hint">Mỗi dòng là một tên. Cũng có thể ngăn cách bằng dấu phẩy.</p>
        </div>
        <div class="stack">
          <div>
            <label for="separator">Ký tự ngăn cách</label>
            <input id="separator" value="_" maxlength="10" placeholder="Ví dụ: _ hoặc -">
          </div>
          <div>
            <label for="position">Vị trí thêm</label>
            <select id="position">
              <option value="suffix">Phía sau tên</option>
              <option value="prefix">Phía trước tên</option>
            </select>
          </div>
        </div>
      </div>

      <div class="summary">
        <strong>Xem trước</strong>
        <span id="counter">0 file</span>
      </div>
      <ol id="preview"><li class="empty">Chưa có tên để xem trước.</li></ol>

      <div class="actions">
        <button id="saveFolder" disabled>Lưu tất cả vào thư mục</button>
        <button id="downloadZip" class="secondary" disabled>Tải một file ZIP</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
